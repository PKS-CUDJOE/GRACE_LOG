<svg width="360" height="100" viewBox="0 0 360 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .word { font-family: Georgia, 'Times New Roman', serif; }
    </style>
  </defs>

  <!-- Icon: an open book with a small leaf rising from its spine,
       standing for "grace" (growth) meeting "log" (recorded pages) -->
  <g transform="translate(6, 22)">
    <path d="M28 6 C18 0, 6 0, 0 4 L0 46 C6 42, 18 42, 28 48 Z"
          fill="#EEF1EC" stroke="#26312B" stroke-width="2" stroke-linejoin="round"/>
    <path d="M28 6 C38 0, 50 0, 56 4 L56 46 C50 42, 38 42, 28 48 Z"
          fill="#FBFAF7" stroke="#26312B" stroke-width="2" stroke-linejoin="round"/>
    <path d="M28 6 L28 48" stroke="#26312B" stroke-width="2"/>
    <path d="M6 12 L20 12 M6 20 L20 20 M6 28 L18 28"
          stroke="#5B6660" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M36 12 L50 12 M36 20 L50 20 M38 28 L50 28"
          stroke="#5B6660" stroke-width="1.4" stroke-linecap="round"/>

    <!-- small leaf rising from the spine -->
    <g transform="translate(20, -14)">
      <path d="M8 22 C8 10, 2 2, 8 -4 C14 2, 8 10, 8 22 Z"
            fill="#6B8265" stroke="#4E6249" stroke-width="1.2"/>
      <path d="M8 20 L8 0" stroke="#4E6249" stroke-width="1"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="82" y="60" class="word" font-size="40" font-weight="600" fill="#26312B">Grace<tspan fill="#6B8265">Log</tspan></text>

  <!-- Tagline -->
  <text x="84" y="80" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.5" fill="#5B6660">DAILY SCRIPTURE JOURNAL</text>
</svg>
